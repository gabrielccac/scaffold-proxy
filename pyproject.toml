[project]
name = "scaffold-proxy"
version = "0.1.0"
description = "Collect and validate free proxies (BR-first)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "wreq>=0.12.0",
]

[project.scripts]
scaffold-proxy = "scaffold_proxy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scaffold_proxy"]

[tool.uv]
dev-dependencies = []
