[project]
name = "scaffold-proxy"
version = "0.2.0"
description = "Collect, persist, score, and routinely validate free proxies"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "wreq>=0.12.0",
    "sqlalchemy>=2.0",
    "apscheduler>=3.10",
]

[project.scripts]
scaffold-proxy = "scaffold_proxy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scaffold_proxy"]
